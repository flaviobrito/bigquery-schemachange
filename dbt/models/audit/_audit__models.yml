version: 2

models:
  - name: audit_schema_snapshots
    description: History of physical columns in the BRONZE dataset (first and last time each was seen).
    columns:
      - name: column_signature
        description: Surrogate key of schema, table, column and data type.
        data_tests: [unique, not_null]

  - name: audit_schema_drift
    description: >
      Physical BRONZE columns versus dbt source declarations. Read by
      ops/check_schema_drift.py, which posts non-aligned rows to Slack/Teams.
    columns:
      - name: drift_status
        description: aligned | missing_in_database | undeclared_in_dbt | type_mismatch
        data_tests:
          - accepted_values:
              arguments:
                values: [aligned, missing_in_database, undeclared_in_dbt, type_mismatch]
