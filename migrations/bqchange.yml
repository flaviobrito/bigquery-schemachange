# bqchange configuration. Rendered with Jinja: env_var('NAME', 'default').
#
# No credentials here: authentication uses Application Default Credentials
# (gcloud locally, Workload Identity Federation in GitHub Actions).
# BQ_ENV selects the environment: dev, prod or pr_<number>. Every environment
# lives in the same project as a set of datasets prefixed with its name.
project: "{{ env_var('GCP_PROJECT_ID') }}"
location: "{{ env_var('BQ_LOCATION', 'US') }}"
root-folder: scripts
modules-folder: modules
change-history-table: "{{ env_var('BQ_ENV') }}_meta.change_history"
create-change-history-table: true
# Cost guardrail: any single migration job billing more than 1 GiB fails.
maximum-bytes-billed: 1073741824
labels:
  environment: "{{ env_var('BQ_ENV') }}"
  application: ecommerce
# Logical layers of the data platform and the dataset that implements each one
# in this environment. Any layout works (medallion, staging/marts, Data Vault...):
# rename or add layers here, and in `layers` of dbt/dbt_project.yml.
layers:
  bronze: "{{ env_var('BQ_ENV') }}_bronze"
  silver: "{{ env_var('BQ_ENV') }}_silver"
  gold: "{{ env_var('BQ_ENV') }}_gold"
  audit: "{{ env_var('BQ_ENV') }}_audit"
# Layers whose column-level changes `bqchange record-schema` logs.
schema-log-layers: [bronze, silver, gold]
# Layers copied from DEV into pull request environments (plus the meta dataset):
# tables created by migrations and audit history. dbt-built layers are rebuilt.
pr-clone-layers: [bronze, audit]
vars:
  env: "{{ env_var('BQ_ENV') }}"
  # Optional IAM principal granted read access to GOLD, e.g. group:analysts@example.com
  reader_principal: "{{ env_var('BQ_READER_PRINCIPAL', '') }}"
