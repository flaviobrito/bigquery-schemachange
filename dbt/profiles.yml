# No credentials in this file. method: oauth uses Application Default Credentials:
# `gcloud auth application-default login` locally, Workload Identity Federation in CI.
ecommerce:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev: &bigquery
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_ENV') }}_silver"
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 8
      priority: interactive
      job_execution_timeout_seconds: 600
      job_retries: 1
      # Cost guardrail: any single dbt query billing more than 1 GiB fails.
      maximum_bytes_billed: 1073741824
    ci: *bigquery
    prod: *bigquery
