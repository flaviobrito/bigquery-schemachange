version: 2

models:
  - name: stg_ecommerce__customers
    description: Latest version of each customer, with standardized names, email and location.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: ref('dim_customers')
    columns:
      - name: customer_id
        description: Customer natural key.
        data_tests: [unique, not_null]
      - name: email
        description: Lower-cased, trimmed email address.
      - name: is_email_valid
        description: True when the email matches a basic address pattern.
      - name: country_code
        description: ISO 3166-1 alpha-2 country code.
        data_tests:
          - not_null:
              config:
                severity: warn
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^[A-Z]{2}$"
              config:
                where: country_code is not null
      - name: has_marketing_opt_in
        description: Customer accepted marketing communication (false when unknown).
        data_tests: [not_null]

  - name: stg_ecommerce__products
    description: Product catalog with normalized SKU and category.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: sku
        data_tests:
          - unique
          - not_null
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: [electronics, home, fashion, beauty, sports, books, toys]
      - name: unit_price
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: unit_cost
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "unit_cost <= unit_price"
          config:
            severity: warn

  - name: stg_ecommerce__orders
    description: >
      Order headers, incrementally merged on order_id so the latest status wins.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ecommerce__customers')
                field: customer_id
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [placed, paid, shipped, delivered, cancelled, returned]
      - name: order_channel
        data_tests:
          - accepted_values:
              arguments:
                values: [web, mobile_app, marketplace]
      - name: currency_code
        data_tests:
          - accepted_values:
              arguments:
                values: [BRL, USD, EUR]
      - name: shipping_amount
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: discount_amount
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: ordered_at
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "timestamp('2020-01-01')"
                max_value: "timestamp_add(current_timestamp(), interval 1 day)"

  - name: stg_ecommerce__order_items
    description: Order lines with extended amount (quantity x unit price).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, product_id]
          config:
            severity: warn
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ecommerce__orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ecommerce__products')
                field: product_id
      - name: quantity
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100
      - name: unit_price
        data_tests:
          - non_negative

  - name: stg_ecommerce__payments
    description: Payment transactions with normalized method and status.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_ecommerce__orders')
                field: order_id
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments:
                values: [credit_card, debit_card, pix, boleto, paypal]
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: [approved, declined, refunded]
      - name: amount
        data_tests:
          - not_null
          - non_negative
